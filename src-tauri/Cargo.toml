[package]
name = "faro-desktop"
version = "0.4.0"
description = "FARO Desktop for macOS"
authors = ["FARO"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
# Without the native feature keyring falls back to an in-memory mock store on
# macOS.  OAuth configuration would then appear saved for a moment but vanish
# before the token exchange.  Explicitly use the macOS Keychain backend.
keyring = { version = "3", features = ["apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = { version = "0.10.1", features = ["getrandom"] }
sha2 = "0.10.9"
zeroize = "1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "block2"] }
